# Fly.io configuration for the always-on LDR Telegram bot.
app = "acrossborders"
primary_region = "sin"

[build]

[env]
  DB_PATH = "/data/ldr.db"

# Persistent SQLite storage for streaks, timezones, and weekly submissions.
[[mounts]]
  source = "ldr_data"
  destination = "/data"

# Keep at least one machine running continuously. The bot uses outbound
# Telegram long-polling, so it does not need an HTTP endpoint; this block is
# only being used to make Fly's machine lifecycle explicit.
[http_service]
  internal_port = 8080
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# Keep exactly one small machine running.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  memory_mb = 256
